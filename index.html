<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Databricks Certified Data Engineer Professional — Practice Exam 4</title>
<style>
  :root{
    --ink:#131b23;
    --ink-soft:#4b5a68;
    --paper:#f2f4f6;
    --card:#ffffff;
    --line:#d7dee5;
    --ok:#0f6b4f;
    --ok-bg:#e6f3ed;
    --no:#9a3b32;
    --no-bg:#f6ebea;
    --mark:#1e4f7a;
    --shadow:0 1px 0 rgba(19,27,35,.06);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15.5px;
    line-height:1.75;
  }
  header{
    background:var(--ink);
    color:#eef2f5;
    padding:34px 22px 26px;
  }
  .wrap{max-width:860px;margin:0 auto}
  h1{
    margin:0 0 6px;
    font-size:1.45rem;
    font-weight:700;
    letter-spacing:.01em;
    line-height:1.4;
  }
  .sub{margin:0;color:#9fb1c0;font-size:.85rem}
  .stats{margin-top:18px;display:flex;gap:26px;flex-wrap:wrap;font-size:.82rem;color:#9fb1c0}
  .stats b{color:#fff;font-size:1.5rem;font-weight:700;display:block;line-height:1.2}
  .controls{
    position:sticky;top:0;z-index:10;
    background:rgba(242,244,246,.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:12px 22px;
  }
  .ctl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=search]{
    flex:1;min-width:180px;
    padding:8px 12px;border:1px solid var(--line);border-radius:6px;
    background:#fff;font:inherit;font-size:.86rem;color:var(--ink);
  }
  input[type=search]:focus,button:focus-visible,.chip:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
  button{
    font:inherit;font-size:.82rem;cursor:pointer;
    padding:8px 14px;border-radius:6px;border:1px solid var(--line);
    background:#fff;color:var(--ink);
  }
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{padding:26px 22px 90px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .qhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
  .qnum{font-size:1.05rem;font-weight:700;color:var(--mark)}
  .domain{
    font-size:.72rem;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:4px;padding:2px 8px;
  }
  .qtext{margin:0 0 16px;font-size:.97rem}
  .code-block{
    white-space:pre-wrap;word-break:break-word;
    font-family:'SFMono-Regular',Consolas,Menlo,monospace;
    font-size:.82rem;line-height:1.5;
    background:#f5f5f7;border:1px solid var(--line);border-radius:6px;
    padding:10px 12px;margin:8px 0;overflow-x:auto;display:block;
  }
  ol.opts{list-style:none;margin:0;padding:0;counter-reset:o}
  ol.opts li{
    counter-increment:o;
    border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;margin-bottom:9px;background:#fcfdfd;
  }
  li.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt-t{display:flex;gap:10px;font-size:.9rem}
  .opt-t::before{
    content:counter(o,upper-alpha);
    font-weight:700;color:var(--ink-soft);flex:none;
  }
  li.correct .opt-t::before{color:var(--ok)}
  .verdict{
    display:inline-block;margin-top:9px;font-size:.72rem;font-weight:700;
    padding:2px 8px;border-radius:4px;
  }
  .v-ok{background:var(--ok);color:#fff}
  .v-no{background:var(--no-bg);color:var(--no)}
  .exp{margin:7px 0 0;font-size:.85rem;color:var(--ink-soft)}
  .exp-ja{
    margin-top:5px;padding-left:10px;
    border-left:2px solid #c9d4de;color:#3d4f5f;
  }
  .ov-ja{
    margin:8px 0 0;padding-top:8px;
    border-top:1px dashed #c2d0dd;color:#33475a;
  }
  body.hide-answers .exp-ja{display:none}
  .card.shown .exp-ja{display:block!important}
  .overall{
    margin-top:16px;padding:14px 16px;border-left:3px solid var(--mark);
    background:#f4f7fa;border-radius:0 8px 8px 0;font-size:.88rem;
  }
  .overall h4{margin:0 0 6px;font-size:.76rem;color:var(--mark);font-weight:700}
  .jp{
    margin-top:12px;padding:12px 16px;border-radius:8px;
    background:#fff8ec;border:1px solid #f0e0c2;font-size:.88rem;
  }
  .jp h4{margin:0 0 4px;font-size:.76rem;color:#8a6a2c;font-weight:700}
  body.hide-answers li.correct{border-color:var(--line);background:#fcfdfd}
  body.hide-answers .verdict,
  body.hide-answers .exp,
  body.hide-answers .overall,
  body.hide-answers .jp{display:none}
  .reveal{margin-top:12px;display:none;font-size:.78rem;padding:6px 12px}
  .card.shown .reveal{background:var(--ink);color:#fff;border-color:var(--ink)}
  body.hide-answers .reveal{display:inline-block}
  .card.shown li.correct{border-color:var(--ok)!important;background:var(--ok-bg)!important}
  .card.shown .verdict,.card.shown .exp,.card.shown .overall,.card.shown .jp{display:block!important}
  .card.shown .verdict{display:inline-block!important}
  .empty{text-align:center;color:var(--ink-soft);padding:40px}
  @media print{
    .controls{display:none}
    body{background:#fff}
    .card{break-inside:avoid;box-shadow:none}
  }
</style>
</head>
<body class="hide-answers">
<header>
  <div class="wrap">
    <h1>Databricks Certified Data Engineer Professional<br>Practice Exam 4</h1>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="ctl-row">
      <input type="search" id="search" placeholder="キーワード検索（例: Auto Loader, CDF, ウォーターマーク）">
      <button id="toggle-ans" class="on">すべての解答を表示</button>
      <button id="expand-all" style="display:none">全部表示</button>
    </div>
  </div>
</div>

<main>
  <div class="wrap" id="list"></div>
  <div class="wrap empty" id="empty" style="display:none">該当する問題がありません。</div>
</main>

<script>
const DATA = [
{
n:1, d:"Delta Lake",
q:"毎晩完全に上書きされる 'daily_activities' テーブルがあります。監査のため、Time Travel 機能で新バージョンと直前バージョンの差分を求める後処理を作ります。current_version を取得済みの状態で、正しいクエリはどれですか。",
o:[
 {t:"SELECT * FROM daily_activities EXCEPT SELECT * FROM daily_activities@v{current_version-1}", c:true, e:"正解。EXCEPT 集合演算子を使うことで、新バージョンと直前バージョンのテーブルの差分を取得できる。"},
 {t:"SELECT * FROM daily_activities MINUS SELECT * FROM daily_activities AS VERSION = {current_version-1}", c:false, e:"Spark SQL に MINUS という演算子は存在せず(標準SQLの一部方言のみ)、構文も誤り。"},
 {t:"SELECT * FROM daily_activities INTERSECT SELECT * FROM daily_activities AS VERSION = {current_version-1}", c:false, e:"INTERSECT は共通部分を返すもので、差分(新しく追加/変更された行)を求める目的には合わない。"},
 {t:"SELECT * FROM daily_activities UNION SELECT * FROM daily_activities AS VERSION = {current_version-1}", c:false, e:"UNION は結合であり差分ではない。"}
],
ov:"Delta Lake テーブルを変更する各操作は新しいテーブルバージョンを作成する。この履歴情報を使って操作を監査したり、特定時点のテーブルをバージョン番号(SELECT * FROM my_table@v36 や SELECT * FROM my_table VERSION AS OF 36)やタイムスタンプ(SELECT * FROM my_table TIMESTAMP AS OF \"2019-01-01\")でクエリしたりできる。EXCEPT 集合演算子を使うことで、新バージョンと直前バージョンのテーブルの差分を取得できる。",
jp:"バージョン指定のタイムトラベル構文(@vN、VERSION AS OF、TIMESTAMP AS OF)と、差分抽出には EXCEPT を使う、という2つの知識を組み合わせる問題。MINUS/INTERSECT/UNIONはこの用途には使わない。"
},
{
n:2, d:"Structured Streaming",
q:"あるデータエンジニアが、クラウドストレージから大量の JSON ファイルを増分取り込みするため次の Auto Loader ストリームを実装しました。\n\n(spark.readStream.format(\"cloudFiles\")\n        .option(\"cloudFiles.format\", \"json\")\n        ____________________________\n        .load(\"/path/to/files\")\n)\n\n既定では、Auto Loader は最初に検出する50GBまたは1000ファイルをサンプリングしてスキーマを推論する。しかし、このデータエンジニアは以降の実行での再サンプリングを避けスキーマ推論のコストを削減しつつ、時系列でのスキーマ変更の追跡は引き続き可能にしたいと考えている。空欄に入る正しいオプションはどれですか。",
o:[
 {t:".option(\"checkpointLocation\", \"/path/to/checkpoint\")", c:false, e:"checkpointLocation はストリーム処理の進捗管理用であり、スキーマ推論結果の保存場所ではない。"},
 {t:".option(\"cloudFiles.schemaEvolutionMode\", \"addNewColumns\")", c:false, e:"スキーマ進化のモードを設定するオプションであり、推論結果を保存して再サンプリングを避けるための設定ではない。"},
 {t:".option(\"cloudFiles.schemaLocation\", \"/path/to/checkpoint\")", c:true, e:"正解。推論したスキーマを指定した場所に保存させることで、以降の実行でファイルを再サンプリングする必要がなくなり、スキーマ推論のコストを削減しつつ、スキーマ変更の追跡も継続できる。"},
 {t:".option(\"mergeSchema\", true)", c:false, e:"これは書き込み側でテーブルスキーマへ新しい列を反映させるオプションであり、読み込み側の推論コスト削減とは別の目的。"}
],
ov:"空欄に入る正しいオプションは .option(\"cloudFiles.schemaLocation\", \"/path/to/checkpoint\") である。これは Auto Loader に対し、推論したスキーマを指定した場所に保存するよう指示するもので、以降の実行ではファイルを再サンプリングする必要がなくなり、スキーマ推論のコストを削減しつつ、時系列でのスキーマ進化の追跡を引き続き可能にする。",
jp:"cloudFiles.schemaLocation＝推論したスキーマの保存場所(再サンプリング回避)。checkpointLocation(ストリーム進捗)、mergeSchema(書き込み側の反映)とは役割が異なる、という3者の区別が核心。"
},
{
n:3, d:"開発ツール・Git",
q:"GitHub へプッシュされた Databricks の Python ファイルのソースコード先頭行に '# Databricks notebook source' というコメントがあります。このコメントの目的を説明しているのはどれですか。",
o:[
 {t:"生成されたコードの出所を人間が理解しやすくするためのコメントである", c:false, e:"人間の理解を助けるための説明コメントではない。"},
 {t:"この Python ファイルを Databricks ワークスペースの検索インデックスへ追加するためのコメントである", c:false, e:"検索インデックスとは無関係。"},
 {t:"この Python ファイルを Databricks ノートブックとして確立するためのコメントである", c:true, e:"正解。ファイルの最初のセルにこのコメントを追加することで、Python・SQL・Scala・R のスクリプトを単一セルのノートブックへ変換できる。"},
 {t:"Python の自動生成ドキュメントのために使われるコメントである", c:false, e:"ドキュメント自動生成の仕組みではない。"}
],
ov:"ファイルの最初のセルに '# Databricks notebook source' というコメントを追加することで、Python・SQL・Scala・R のスクリプトを単一セルのノートブックへ変換できる。",
jp:"Exam4 Q43と対になる問題(逆方向の問いかけ)。このコメントの正体＝Databricksが『これはノートブックである』と解釈するためのマーカー、という一点を暗記する。"
},
{
n:4, d:"Unity Catalog・ガバナンス",
q:"Unity Catalog で Delta Share を作成・管理できる能力を持つユーザーを2つ選んでください。",
o:[
 {t:"Workspace admins", c:false, e:"ワークスペース管理者というだけでは Delta Share の作成・管理の権限を自動的には持たない。"},
 {t:"Account admins", c:false, e:"アカウント管理者というだけでは Delta Share の作成・管理の権限を自動的には持たない。"},
 {t:"Metastore admins", c:true, e:"正解。メタストア管理者は Delta Share の作成・管理に必要な権限を明示的に持つ。"},
 {t:"Users with MANAGE privilege for the metastore", c:false, e:"メタストアへの MANAGE 権限だけでは Delta Share の作成・管理には直結しない。"},
 {t:"Users with CREATE SHARE privilege for the metastore", c:true, e:"正解。CREATE SHARE 権限を持つユーザーは、その権限によって明示的に Delta Share を作成・管理できる。"}
],
ov:"Unity Catalog で Delta Share を作成・管理する能力を持つのは、メタストア管理者と、メタストアに対する CREATE SHARE 権限を持つユーザーである。これらの役割は Delta Share を作成・管理するために必要な権限を明示的に持っている。",
jp:"Delta Share の作成権限は Metastore admin と CREATE SHARE 権限保持者の2者に限定される。Workspace admin や Account admin では不十分、MANAGE 権限だけでも不十分、という細かい区別が問われる。"
},
{
n:5, d:"ジョブ・ワークフロー",
q:"あるデータエンジニアが次の Declarative Automation Bundle(DAB)プロジェクトを持っています。\n\nresources:\n    apps:\n        bookstore_app:\n            name: \"bookstore_demo\"\n            source_code_path: ../src/bookstore\n\n    volumes:\n        bookstore_volume:\n            name: \"bookstore\"\n            catalog_name: demo_catalog\n            schema_name: demo_schema\n            grants:\n                - principal: ${resources.apps.bookstore_app.id}\n                privileges:\n                    - READ_VOLUME\n                    - WRITE_VOLUME\n\nこの DAB プロジェクトをデプロイした結果を正しく説明しているのはどれですか。",
o:[
 {t:"参照 ${resources.apps.bookstore_app.id} が誤りで、正しくは ${resources.apps.bookstore_demo.id} であるべきなのでエラーになる", c:false, e:"リソースキーは apps セクションの見出し(bookstore_app)であり、name フィールドの値(bookstore_demo)ではない。参照は正しい。"},
 {t:"Databricks App bookstore_app とボリューム bookstore_volume がデプロイされ、App に紐づくサービスプリンシパルにボリュームへの読み書きアクセスが付与される", c:true, e:"正解。App(表示名 'bookstore_demo')とボリュームが作成され、App に紐づくサービスプリンシパルへ READ_VOLUME・WRITE_VOLUME の権限が自動的に付与される。"},
 {t:"ボリューム bookstore_volume と、ボリュームへの読み書きアクセスを持つサービスプリンシパル bookstore_app がデプロイされる", c:false, e:"bookstore_app はサービスプリンシパルそのものではなく Databricks App であり、その App に紐づくサービスプリンシパルへ権限が付与される。"},
 {t:"カタログ demo_catalog、スキーマ demo_schema、ボリューム bookstore_volume、App bookstore_app がデプロイされ、3階層の名前空間でボリュームへアクセスする", c:false, e:"catalog_name・schema_name は既存のカタログ・スキーマを指定するものであり、それら自体を新規作成するわけではない。"}
],
ov:"この DAB プロジェクトをデプロイすると、bookstore_app という Databricks App(表示名 'bookstore_demo')と、指定したカタログ demo_catalog・スキーマ demo_schema 内に bookstore_volume というボリュームの2つのリソースが正常に作成される。構成には grant 文が含まれ、${resources.apps.bookstore_app.id} を使ってアプリの識別子を正しく参照しており、これによりデプロイされた Databricks App に紐づくサービスプリンシパルへ、作成したボリュームに対する READ_VOLUME と WRITE_VOLUME の両方の権限が自動的に付与される。",
jp:"DABの${resources.<type>.<key>.id}参照構文は、YAML内のリソースキー(見出し)を指すのであって、name フィールドの表示値を指すのではない、という点が最重要。この区別を誤ると設問のような誤答を選んでしまう。"
},
{
n:6, d:"パフォーマンス最適化",
q:"約750GBの大きな UC マネージド Delta テーブルで、高強度な CDC フィードの適用時に性能が低下しています。改善のために取るべき対応はどれですか。",
o:[
 {t:"テーブルで deletion vectors を有効化し、主キーで liquid clustering を適用する", c:true, e:"正解。deletion vectors により削除・更新された行をファイルの完全な書き換えなしに効率的に追跡・管理でき、CDC のマージキーで liquid clustering を適用することで関連レコードが物理的に近接し、更新・削除時にスキャンするデータ量を最小化できる。"},
 {t:"テーブルで deletion vectors を有効化し、主キーに Z-order インデックスを適用する", c:false, e:"Z-order は静的な最適化であり、頻繁な CDC フィードには Liquid Clustering の増分的な最適化のほうが適している。"},
 {t:"テーブルをパーティションし、主キーで liquid clustering を適用する", c:false, e:"Liquid Clustering はパーティションの代替であり併用できない。"},
 {t:"テーブルをパーティションし、主キーに Z-order インデックスを適用する", c:false, e:"パーティション+Z-orderの組み合わせは、頻繁な更新・削除を伴うCDCワークロードに最適な組み合わせとは言えない。deletion vectorsとLiquid Clusteringのほうが適している。"}
],
ov:"CDC(Change Data Capture)は更新と削除の処理を伴うため、CDC フィードが遅い大きな Delta テーブルの性能を改善するには、テーブルで deletion vectors を有効化し、主キーで liquid clustering を適用すべきである。deletion vectors を有効化すると、基盤ファイルの完全な書き換えを必要とせずに、削除・更新された行を効率的に追跡・管理でき、CDC 操作のオーバーヘッドを大幅に削減できる。CDC のマージキーに liquid clustering を適用すると、これらのキーに基づいてデータが物理的に整理され、関連レコードが近接して配置され、更新・削除時にスキャンされるデータ量が最小化される。これらの最適化を組み合わせることで、高い取り込み・クエリ性能を維持し、CDC ワークロードのレイテンシを下げ、大規模なテーブルの管理をしやすくできる。",
jp:"CDC(頻繁な更新・削除)ワークロードの最適化パターン：deletion vectors(効率的な論理削除)＋Liquid Clustering(主キーでの物理レイアウト最適化)。パーティション＋Z-orderという旧来の組み合わせより優れている、という現代的な推奨構成。"
},
{
n:7, d:"パフォーマンス最適化",
q:"国際学校のデータエンジニアが次の PySpark コードを実装しました。\n\nfrom pyspark.sql.window import Window\nfrom pyspark.sql.functions import avg, col\n\nwindow_spec = Window.partitionBy(\"student_id\").orderBy(\"exam_date\")\\\n                .rowsBetween(Window.unboundedPreceding, Window.currentRow)\n\ndf_new = df_student_results.withColumn(\"avg_score\", avg(\"score\").over(window_spec))\n\nこのコードが何をするか、正しく説明しているのはどれですか。",
o:[
 {t:"最初に登録された生徒から現在の生徒までの、各試験の累積平均点を示す列を追加する", c:false, e:"partitionBy(\"student_id\") により集計は生徒ごとに独立して行われる。生徒をまたいだ累積ではない。"},
 {t:"生徒に関係なく、各試験の全体平均点を示す列を追加する", c:false, e:"partitionBy により生徒ごとの区分があり、全体平均ではない。"},
 {t:"生徒ごとの全体平均点を、試験日順に示す列を追加する", c:false, e:"rowsBetween(unboundedPreceding, currentRow) は累積(現在行までの範囲)であり、パーティション全体の単純な平均ではない。"},
 {t:"各生徒について、最初の試験から現在の試験までの累積平均点を示す列を追加する", c:true, e:"正解。partitionBy(\"student_id\") で生徒ごとに区分し、orderBy(\"exam_date\") で試験日順に並べ、rowsBetween(unboundedPreceding, currentRow) で先頭行から現在行までを対象とする累積計算になる。"}
],
ov:"この PySpark コードはウィンドウ関数を使って各生徒の累積(実行中の)平均点を計算する。Window.partitionBy(\"student_id\") はデータを student_id に基づいてパーティション(グループ)へ分割し、平均の計算は各生徒の結果セット内で独立して行われる。.orderBy(\"exam_date\") は各生徒のパーティション内の行を試験日(古い順から新しい順)で並べ替える。これは累積計算にとって重要である。.rowsBetween(Window.unboundedPreceding, Window.currentRow) はウィンドウのフレームを定義する。unboundedPreceding はフレームが現在の生徒のパーティション内の最初の行(最初の試験)から始まることを意味し、currentRow はフレームが現在処理中の行(現在の試験)で終わることを意味する。この組み合わせにより、任意の行について、それ以前のすべての行と現在の行を含む計算が行われ、累積的なデータ集合が定義される。avg(\"score\").over(window_spec) はこの window_spec に対して適用され、ウィンドウが student_id でパーティションされ exam_date で累積的であるため、新しい avg_score 列の結果はその特定の生徒についてその特定の試験日までの累積平均点となる。",
jp:"partitionBy(生徒ごとに独立)＋orderBy(時系列)＋rowsBetween(unboundedPreceding, currentRow)(累積)、という3要素の組み合わせで『各生徒ごとの累積平均』が実現される。partitionByの有無が『生徒ごと』か『全体』かを分ける決定的な要素。"

n:25, d:"Structured Streaming",
q:"あるデータエンジニアが、S3 の JSON データを取り込む次の Databricks Auto Loader ストリームを構成しています。\n\nspark.readStream \\\n     .format(\"cloudFiles\") \\\n     .option(\"cloudFiles.format\", \"json\") \\\n     .option(\"cloudFiles.schemaLocation\", \"s3://shop/checkpoints/orders\")\n     .option(\"cloudFiles.schemaEvolutionMode\", \"_______________\") \\\n     .load(\"s3://shop/raw/orders/json/\") \\\n    .writeStream \\\n     .option(\"checkpointLocation\", \"s3://shop/checkpoints/orders\") \\\n     .start(\"orders_table\")\n\nパイプラインは、受信データに新しい列が検出されたら失敗すべきだが、その新しい列はスキーマへ追加され、以降の実行で更新済みスキーマとともに正常に再開できるようにしたい。既存の列はデータ型を維持する必要がある。空欄に入る正しいオプションはどれですか。",
o:[
 {t:"addNewColumns", c:true, e:"正解。Auto Loader の既定のスキーマ進化挙動であり、新しい列が検出されるとストリームは失敗するが、その列はスキーマへ追加される。これによりジョブを再起動し、更新済みスキーマで処理を継続できる。既存列の型は変更されない。"},
 {t:"none", c:false, e:"スキーマを進化させないモードであり、新しい列が来ると失敗し続ける(スキーマは更新されない)。"},
 {t:"failOnNewColumns", c:false, e:"失敗はするが、新しい列がスキーマへ自動的に追加されるわけではなく手動更新が必要になる。"},
 {t:"rescue", c:false, e:"失敗せず、新しい列は rescued data 列に格納される。要件の『失敗させる』という部分に合わない。"}

ov:"addNewColumns モードは Auto Loader の既定のスキーマ進化挙動である。このモードでは、新しい列が検出されるとストリームは失敗するが、その新しい列はスキーマへ追加される。これによりジョブを再起動し、更新済みスキーマで処理を継続できる。重要な点として、既存の列のデータ型は変更されない。",
jp:"schemaEvolutionMode の4種類の最後の1つ(addNewColumns)を単独で問う出題。『失敗する』が『スキーマは自動更新される』という2つの性質を併せ持つのがこのモードの特徴。failOnNewColumns(Exam3 Q40、失敗して手動更新が必要)との違いに注意。"

n:47, d:"Structured Streaming",
q:"あるデータエンジニアが次のロジックで重複を扱っています。\n\n(spark.readStream\n       .table(\"bronze\")\n       .filter(\"topic = 'orders'\")\n       .select(F.from_json(F.col(\"value\").cast(\"string\"), schema).alias(\"v\"))\n       .select(\"v.*\")\n       .withWatermark(\"order_timestamp\", \"30 seconds\")\n       .dropDuplicates([\"order_id\", \"order_timestamp\"]))\n\nしかし、このロジックだけでは、ウォーターマークの閾値より遅れて到着したイベントの重複を防げないことに気づきました。foreachBatch 関数に含めて完全に重複を処理できるコードはどれですか。",
o:[
 {t:"APPLY CHANGES INTO orders_silver a FROM STREAM(microbatch) KEYS (order_id, order_timestamp) SEQUENCE BY order_timestamp COLUMNS *", c:false, e:"APPLY CHANGES / AUTO CDC は SDP パイプライン専用の構文であり、通常の foreachBatch 関数内では使えない。"},
 {t:"COPY INTO orders_silver FROM microbatch DISTINCT ALL COPY_OPTIONS (...)", c:false, e:"COPY INTO にそのような DISTINCT ALL という構文は存在しない。"},
 {t:"MERGE INTO orders_silver a USING microbatch b ON a.order_id=b.order_id AND a.order_timestamp=b.order_timestamp WHEN NOT MATCHED THEN INSERT *", c:true, e:"正解。insert-only merge を使い、マイクロバッチの各行をターゲットテーブルに既に存在するかどうかで判定することで、遅れて到着したデータも含めて重複を防げる。"},
 {t:"spark.readStream.table(\"microbatch\").withWatermark(\"order_timestamp\", \"7 days\").dropDuplicates([\"order_id\", \"order_timestamp\"])", c:false, e:"foreachBatch内のmicrobatchはDataFrameであり、これをさらにreadStreamで読むことはできない。またウォーターマークを長くするだけでは根本的な解決にはならない。"}
],
ov:"Spark Structured Streaming では、ウォーターマーク付きの dropDuplicates は、定義したイベント時刻の閾値内(例えば order_timestamp から30秒以内)に到着した重複のみを除去する。しかし、その閾値より遅れて到着したレコードは「遅すぎる」と見なされ、Spark のインメモリ状態では重複排除されない。完全な重複排除(非常に遅れて到着したデータを含む)を保証するには、foreachBatch のシンクで Delta Lake の MERGE 操作を使った冪等な書き込みパターンを使える。MERGE INTO 文は、受信する各マイクロバッチ(microbatch)を、一意なキー(order_id と order_timestamp)に基づいてターゲット Delta テーブル(orders_silver)と比較する。ターゲットテーブルにまだ存在しない行のみを挿入することで、マイクロバッチをまたいでも、あるいは遅れて到着した場合でも重複を防ぐ。ストリーム内での重複排除(ニアリアルタイム性能のため)と MERGE ベースの重複排除(完全性と正確性のため)を組み合わせることで、ストリーミングパイプラインにおいて重複をエンドツーエンドで確実に扱える。",
jp:"ウォーターマーク付き dropDuplicates(近い過去のみ)＋foreachBatchでのinsert-only merge(全期間にわたる完全な重複排除)、という二段構えの設計。Exam1 Q10・Exam2 Q49で学んだinsert-only mergeの知識が、ここでウォーターマークとの組み合わせとして完成する。"
},

const TRANS = {};

const list = document.getElementById('list');
const search = document.getElementById('search');
const toggleAns = document.getElementById('toggle-ans');

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function fmt(s){ const e = esc(s); return e.includes('\n') ? `<span class="code-block">${e}</span>` : e; }

function render(){
  const term = search.value.trim().toLowerCase();
  const rows = DATA.filter(item => {
    if (!term) return true;
    const blob = (item.q + item.ov + item.jp + item.o.map(o => o.t + o.e).join(' ')).toLowerCase();
    return blob.includes(term);
  });

  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  list.innerHTML = rows.map(item => {
    const tr = TRANS[item.n] || {};
    return `
    <article class="card" id="q${item.n}">
      <div class="qhead">
        <span class="qnum">Q${item.n}</span>
        <span class="domain">${esc(item.d)}</span>
      </div>
      <p class="qtext">${fmt(item.q)}</p>
      <ol class="opts">
        ${item.o.map((o, i) => `
          <li class="${o.c ? 'correct' : ''}">
            <div class="opt-t"><span>${fmt(o.t)}</span></div>
            <span class="verdict ${o.c ? 'v-ok' : 'v-no'}">${o.c ? '正解' : '誤り'}</span>
            <p class="exp">${esc(o.e)}</p>
            ${tr.o && tr.o[i] ? `<p class="exp exp-ja">${esc(tr.o[i])}</p>` : ''}
          </li>`).join('')}
      </ol>
      <button class="reveal" onclick="toggleCard(this)">解答を表示</button>
      <div class="overall"><h4>Overall explanation</h4>${esc(item.ov)}
        ${tr.ov ? `<p class="ov-ja">${esc(tr.ov)}</p>` : ''}
      </div>
      <div class="jp"><h4>覚えるポイント</h4>${esc(item.jp)}</div>
    </article>`;
  }).join('');
}

function toggleCard(btn){
  const card = btn.closest('.card');
  const shown = card.classList.toggle('shown');
  btn.textContent = shown ? '解答を隠す' : '解答を表示';
}

toggleAns.onclick = () => {
  const hidden = document.body.classList.toggle('hide-answers');
  toggleAns.textContent = hidden ? 'すべての解答を表示' : 'すべての解答を隠す';
  toggleAns.classList.toggle('on', hidden);
  document.querySelectorAll('.card.shown').forEach(c => c.classList.remove('shown'));
  document.querySelectorAll('.reveal').forEach(b => b.textContent = '解答を表示');
};
search.oninput = render;
render();
</script>
